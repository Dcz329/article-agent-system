server:
  port: 8080

spring:
  application:
    name: article-agent-system
  datasource:
    url: jdbc:mysql://localhost:3306/ai_article?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

app:
  jwt:
    secret: ${JWT_SECRET:ArticleAgentSystemJwtSecretKeyForDemo2026ChangeMe!}
    expire-days: 7
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: https://api.deepseek.com
    # 2026 ?????deepseek-v4-flash??/???/ deepseek-v4-pro????
    model: deepseek-v4-flash